[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dummypy"
# Derived from the git tag by hatch-vcs, not written here -- see [tool.hatch.version].
dynamic = ["version"]
description = "A dummy Python analytics library for demonstration purposes."
authors = [{ name = "Mark Richardson", email = "mrichardson82@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["dummypy", "analytics", "demo", "example"]
# The release workflow greps this list for "Private :: Do Not Upload" to decide
# whether to publish; removing that classifier starts uploading to PyPI.
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=2.4.6",
    "attrs>=25.3",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/markrichardson/dummyrepo"
Repository = "https://github.com/markrichardson/dummyrepo"

# dependencies only needed by the notebooks
[dependency-groups]
notebook = [
    "loman>=0.7.0",
]

dev = [
    "marimo>=0.24.2",
    "plotly>=6.9.0",
]

test = [
    "pytest>=9.1.1",
    "hypothesis>=6.168.0",
    # The rhiza conformance checks, as a plugin instead of the seven files the template
    # copied into `.rhiza/tests/` — that folder is listed under `exclude:` in
    # `.rhiza/template.yml`, and `tests/rhiza/` re-exports the check modules so they run
    # under `make test`. Consumer-side pilot of jebel-quant/rhiza#1540.
    "pytest-rhiza>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dummypy"]

# The version is derived from the newest reachable git tag by hatch-vcs, so `v0.2.0` in
# git is the single source of truth and no number is written down anywhere. A release is
# then a tag and nothing else -- there is no bump commit to make, which is why
# [tool.bumpversion] and its README-footer [[files]] entry are gone rather than merely
# unused. Don't re-add a written [project].version alongside this; two sources drift.
#
# Consequences worth knowing:
#
#   - **The build needs to see the tag.** hatch-vcs falls back rather than fails, so a
#     shallow checkout builds `0.1.dev1+g<sha>` under a green tick. `rhiza_release.yml`
#     checks out with `fetch-depth: 0` and re-verifies the built filename against the
#     tag, which is the one place a derived version can be caught being wrong.
#   - **A working tree with no tags reachable** (a fresh shallow clone, an archive
#     export) builds a `0.0.x.dev` version. `raw-options.fallback_version` below keeps
#     that from being an error. The key is spelled with an underscore because
#     raw-options are forwarded verbatim as keyword arguments to setuptools-scm's
#     `get_version()`; `fallback-version` raises a TypeError there.
#   - `uv version --short` exits 2 on a dynamic version; the release workflow probes
#     [project].dynamic and skips the file-versus-tag comparison for that reason.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

# pandas ships no type stubs (PEP 561); the optional pandas-stubs package is
# third-party and lags the runtime. Silence mypy --strict's missing-import error
# for pandas without pulling in stubs that would churn under strict mode.
[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.deptry.package_module_name_map]
marimo = "marimo"
pandas = "pandas"
loman = "loman"
attrs = "attrs"
numpy = "numpy"
plotly = "plotly"


# The developer tasks come from `rhiza-task` on PyPI (see Makefile and CLAUDE.md); this
# table is where what used to be a make variable, or a target shadowed in the root
# Makefile, is said instead. It is read as layer 3 of the CLI's resolution order
# (defaults -> .rhiza/.env -> pyproject.toml -> RHIZA_* environment); layer 2 is gone,
# so this is the only place the repo configures the task layer.
#
# Only entries that differ from the CLI's own default belong here -- `uvx rhiza-task print
# <setting>` shows what one resolves to. Every value below was re-checked against
# rhiza-task@0.3.1, which is the version `rhiza_ci.yml@v1.4.2` pins for every gate step;
# the `RHIZA_TASK` pin in the Makefile governs local `make` only.
[tool.rhiza-task]
# The OS matrix CI runs on, moved here from `.rhiza/.env` now that nothing reads that file.
#
# Not optional, and not a default restated: `rhiza-task`'s own default is `["ubuntu-latest"]`.
# rhiza_ci.yml's `generate-matrix` asks the CLI (`uvx rhiza-task@0.3.1 ci-os-matrix`) and
# exports RHIZA_CI_OS_MATRIX as the empty string for every repository that is not the mother
# -- deliberately, so the consumer answers -- and the CLI treats an empty setting as unset.
# With the dotenv deleted and nothing said here, the answer would be the default: CI would
# keep passing while quietly testing one OS instead of three. That is the failure mode worth
# spelling out, because it is green.
ci-os-matrix = ["ubuntu-latest", "macos-latest", "windows-latest"]

# python.mk's default was `both`; rhiza-task's is `ty`. Said here so the migration does not
# quietly stop running mypy --strict -- which this project is written for, down to the
# [[tool.mypy.overrides]] entry for pandas above. It is also stricter than the make layer
# was: the retired shell `case` let mypy's exit status win, so a `ty` failure could pass,
# where the CLI raises on each run.
typechecker = "both"

# src/ is fully covered and stays that way. This was `COVERAGE_FAIL_UNDER = 100` in the
# root Makefile, deliberately there rather than in the uncommitted local.mk so that a
# regression below 100% fails `make test` for everyone. It still does. The CLI default is
# 90, and `test` passes --cov-fail-under on the command line, which outranks
# [tool.coverage.report] -- so this line, not that table, is the gate.
coverage_fail_under = 100

# pytest-rhiza from PyPI, pinned exactly rather than floored: a gate that moves under you
# is not a gate. Dropping this line would *downgrade* the conformance checks -- the CLI's
# own default still names a git tag at v0.2.0. The `test` dependency group pins the same
# distribution for a different reason -- there it is what `tests/rhiza/` imports under
# `make test`; here it is what `make rhiza-test` provisions on the fly. Keep the two in
# step.
#
# Moved from ==0.2.1 to ==0.6.0 by the switch to a VCS-derived version, which also closed
# the long-standing drift between the two pins. 0.6.0 is the first release whose python
# layer knows about `dynamic = ["version"]`: all seven version checks then skip with an
# explicit reason. Earlier ones read `[project].version` as the empty string and fail --
# 0.2.1 on `test_required_field_present[version]`, `test_version_follows_semver` and
# `test_latest_tag_matches_pyproject_version`, 0.5.0 on the first two plus
# `test_pyproject_version_is_not_behind_the_latest_tag`. So this floor is load-bearing
# now, not hygiene: below 0.6.0 both `make test` and the `rhiza-test` CI job go red on a
# repo that writes no version down.
pytest-rhiza = "pytest-rhiza==0.6.0"

# Restored in #244 after the v1.4.2 bump dropped it, and kept deliberately even though the
# pins now agree. The note that removed it reasoned that the value "is now the CLI's default
# verbatim, so the entry restated it" -- true at rhiza-task@0.3.1, which is what it was
# checked against, but the Makefile pinned 0.1.2 for local `make` at the time and the
# default was not the same on both sides:
#
#   uvx rhiza-task@0.1.2 print mkdocs_extra_packages  ->  (empty)
#   uvx rhiza-task@0.3.1 print mkdocs_extra_packages  ->  mkdocstrings[python]
#
# So `make book` lost mkdocstrings and died with "mkdocstrings plugin is enabled, but
# mkdocstrings is not installed" -- mkdocs.yml declares the plugin and docs/api/*.md needs
# it for the `:::` directives. CI never saw it, because rhiza_book.yml delegates to
# jebel-quant/rhiza@v1.4.2, which pins its own CLI. Green in CI, broken on a laptop.
#
# #252 has since bumped RHIZA_TASK to 0.3.1, so this line is once again equal to the
# resolved default -- which is precisely the state the v1.4.2 note read as licence to delete
# it. Do not. The equality holds only while both pins say 0.3.1, and neither of them is
# pinned here: the workflow's lives upstream and moves with the template ref. Stating the
# value costs nothing at the current pin and is what makes the book build independent of it.
#
# The old note's warning still stands and is the reason to keep this list at exactly one
# entry -- naming the setting *replaces* the default rather than appending to it, so this is
# the line someone edits to add a package and accidentally drops mkdocstrings from the book
# build with. Add to it, never overwrite it. See #244 and #252.
mkdocs-extra-packages = ["mkdocstrings[python]"]

# Not set, on purpose. Each of these was checked against rhiza-task@0.3.1 rather than
# recalled, and this note is here to stop them being re-added:
#
#   marimo-folder        -- the notebooks are in `docs/notebooks`, which is the CLI default.
#                          Keeping this unset matches Rhiza-based books such as ChebPy.
#   source-folder, layers -- already the defaults (`src`, `python`).
#   license-ignore-packages -- default empty, and correct: nothing here wraps or vendors a
#                          GPL distribution, so the `license` gate's
#                          `--fail-on=GPL;LGPL;AGPL` has nothing to forgive. Do not add
#                          `docutils`; rhiza-task appends that itself when marimo is in the
#                          task registry.
# tests/rhiza/ mirrors no module under src/ and never will — the checks assert about
# the repository, not about dummypy — so the 1:1 layout checker would read the files as
# orphan tests. Exempting the one directory keeps parity enforced everywhere else,
# unlike `enforce = false`.
[tool.check_test_layout]
exempt_dirs = ["rhiza"]
