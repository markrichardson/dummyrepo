# This file is a TEMPORARY, repo-owned variant of Rhiza's book workflow, used
# to trial Cloudflare Pages deployment before Rhiza PR #1660 (artifact-only
# deployment support) is merged and released. See CLAUDE.md's Rhiza-synced
# section: this path is excluded in .rhiza/template.yml so /rhiza:update does
# not overwrite it.
#
# TODO once jebel-quant/rhiza#1660 ships a release:
#   - point `uses:` at the released tag instead of the WIP branch below
#   - change the trigger back to the default branch
#   - drop --branch=cloudflare-test (or use the default-branch expression)

name: "(RHIZA) BOOK — CLOUDFLARE TEST"

on:
  workflow_dispatch:
  push:
    branches:
      - "cloudflare-book-test"

permissions:
  contents: read

jobs:
  book:
    # Temporary: points at the unmerged PR jebel-quant/rhiza#1660 branch.
    uses: jebel-quant/rhiza/.github/workflows/rhiza_book.yml@claude/support-artifact-only-deployment
    with:
      deploy-pages: false
    secrets: inherit
    permissions:
      contents: read

  deploy-cloudflare:
    name: Deploy preview to Cloudflare Pages
    needs: book
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download Rhiza book artifact
        uses: actions/download-artifact@v8
        with:
          name: book
          path: _book

      - name: Deploy Cloudflare preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _book
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=cloudflare-test
