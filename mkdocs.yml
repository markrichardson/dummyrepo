INHERIT: docs/mkdocs-base.yml

site_name: DummyPy
site_url: https://markrichardson.github.io/dummyrepo/
repo_url: https://github.com/markrichardson/dummyrepo
repo_name: markrichardson/dummyrepo

docs_dir: docs

theme:
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - API Reference:
      - Payoffs: api/payoffs.md
      - Grid: api/grid.md
  - Notebooks:
      - Overview: notebooks/index.md
      - Demo: notebooks/demo.html
      - Extras: notebooks/notebook-extras.html
  - Development:
      - Docker: development/DOCKER.md
      - Rhiza: development/rhiza.md
  - Reports:
      - Test Report: reports/html-report/report.html
      - Coverage Report: reports/html-coverage/index.html

plugins:
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
